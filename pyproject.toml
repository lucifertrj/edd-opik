[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-loop"
version = "0.1.0"
description = "Eval-driven RAG loop with LangGraph, Qdrant, and Opik"
requires-python = ">=3.11"
dependencies = [
  "fastembed>=0.4",
  "langchain-community>=0.3",
  "langchain-google-genai>=2.0",
  "langchain-qdrant>=0.2",
  "langchain-text-splitters>=0.3",
  "langgraph>=0.2",
  "opik>=1.8",
  "pypdfium2>=4.30",
  "python-dotenv>=1.0",
  "qdrant-client>=1.12",
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[project.scripts]
rag-loop = "rag_loop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_loop"]
